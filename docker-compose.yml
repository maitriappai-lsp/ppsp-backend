services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: maitri
      POSTGRES_PASSWORD: maitri
      POSTGRES_DB: maitri_lsp
    ports:
      - "5432:5432"
    volumes:
      - maitri_pg_data:/var/lib/postgresql/data

volumes:
  maitri_pg_data:
